# Keep the shipped x86_64 Linux binaries runnable on any x86_64 CPU, including
# older ones without AVX (e.g. the Intel "Goldmont" Celeron/Atom families, which
# is what a lot of small home servers running this are).
#
# Newer build hosts raise the default instruction-set baseline: GCC 15 on the
# current `ubuntu-latest` runner compiles for `x86-64-v3` (AVX/AVX2) by default.
# That silently bakes AVX into the C the `cc` crate builds — SQLite, through
# libsqlite3-sys — with no runtime CPU check, so the first SQLite call dies with
# SIGILL on a pre-AVX CPU. Pin both the Rust and the C compiler back to the base
# x86-64 ISA.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64"]

[env]
# Read by the `cc` crate when it compiles C for the musl target; overrides the
# build host's default `-march` so SQLite is built for base x86-64.
CFLAGS_x86_64_unknown_linux_musl = "-march=x86-64"
