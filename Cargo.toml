# Two crates, and the line between them is compile time rather than design.
#
# The Meshtastic protobufs are a few thousand lines of generated code that change
# only when the vendored .proto files do. In a crate of their own they are built
# once and then left alone, instead of being regenerated and recompiled every
# time anything in the application moves.
[workspace]
members = ["longley-rice", "meshview-proto", "meshview-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
# The Python meshview this is a port of is AGPL-3.0, and so is this.
license = "AGPL-3.0-or-later"
authors = ["Óscar García Amor <ogarcia@connectical.com>"]
repository = "https://github.com/ogarcia/meshview-rs"

# Only what more than one crate needs. Everything else belongs to whichever
# crate actually uses it.
[workspace.dependencies]
prost = "0.14"
