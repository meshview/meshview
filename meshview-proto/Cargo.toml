[package]
name = "meshview-proto"
description = "Meshtastic protobuf types for meshview-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
prost.workspace = true

[build-dependencies]
prost-build = "0.14"
prost-types = "0.14"
# Parses the .proto files in Rust, so neither a developer, the CI runner nor the
# container build has to have protoc installed, or the right version of it.
protox = "0.9"
