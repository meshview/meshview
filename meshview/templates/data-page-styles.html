{#- The data pages' shared look: a compact heading (title, live state and
    actions in one line), tables with a light heading that stays in view, the
    toolbars and the maps some of them have. Packets' own pieces (port tags,
    payloads, cards) are in meshview.css, which Home shares. -#}
<style>
/* Heading: title and context on the left, actions on the right; on narrow
   screens the actions drop under the title. */
.mesh-data-page .data-heading { display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; min-height:40px; margin-bottom:14px; }
.mesh-data-page .data-heading h1 { margin:0; font-size:22px; line-height:1.2; overflow-wrap:anywhere; }
.mesh-data-page .data-heading p { margin:0; color:var(--mesh-muted); font-size:14px; }
.mesh-data-page .data-title { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; min-width:0; }
.mesh-data-page .data-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-left:auto; }
.mesh-data-page .data-actions label { margin:0; font-size:13px; color:var(--mesh-muted); }
.mesh-data-page .data-count { display:inline-flex; align-items:center; height:24px; padding:0 9px; border-radius:var(--mesh-radius-pill); background:var(--mesh-soft); color:var(--mesh-primary); font-size:12.5px; font-weight:600; }
/* Loading, the count keeps its width and shows a spinner in its figures' place. */
.mesh-data-page .data-count[aria-busy="true"] { position:relative; color:transparent; }
.mesh-data-page .data-count[aria-busy="true"]::before { position:absolute; inset:0; margin:auto; color:var(--mesh-primary); }
.mesh-data-page .data-context { font-size:12.5px; color:var(--mesh-muted); }
/* The live state as a pill beside the title. */
.mesh-data-page .data-title .live-status { height:26px; padding:0 10px; border-radius:var(--mesh-radius-pill); background:var(--mesh-soft); color:var(--mesh-primary); font-weight:600; }
.mesh-data-page .data-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:0 0 14px; padding:12px; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); }

/* Tables. The wrapper clips rather than scrolls, so that the heading row can
   follow the page under the header; it scrolls sideways only when the table
   cannot fit (.is-wide, below). */
.mesh-data-page .data-table-wrap { width:100%; overflow:clip; margin-bottom:20px; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); }
.mesh-data-page .data-table-wrap.is-wide { overflow:auto; }
/* Separate borders, none between: collapsed ones do not move with the heading
   cells that stay in view, and the rows under them show through. */
.mesh-data-page table { width:100%; font-size:13px; border-collapse:separate; border-spacing:0; }
.mesh-data-page table th { position:sticky; top:0; z-index:2; height:36px; padding:8px var(--mesh-cell-x); background:var(--mesh-surface-2); border-bottom:1px solid var(--mesh-border); color:var(--mesh-muted); font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; text-align:left; vertical-align:middle; transition:top .2s ease; }
.mesh-data-page .data-table-wrap:not(.is-wide) > table th { top:var(--header-offset,0px); }
.mesh-data-page .data-table-wrap.is-switching > table th { transition:none; }
.mesh-data-page table td { height:var(--mesh-row); padding:var(--mesh-cell-y) var(--mesh-cell-x); border-bottom:1px solid var(--mesh-border-soft); vertical-align:middle; }
.mesh-data-page table tbody tr:hover { background:var(--mesh-surface-2); }
.mesh-data-page table a { color:var(--mesh-text); font-weight:500; }
/* In packet tables the packet id is the row's link out, in the accent. */
.packet-table .c-id a { color:var(--mesh-primary); font-weight:400; }
.packet-table .c-time { color:var(--mesh-muted); }
.mesh-data-page .data-empty { padding:30px 16px; text-align:center; color:var(--mesh-muted); }
.mesh-data-page .payload-row { display:none; }
.mesh-data-page .packet-table tr.expanded + .payload-row { display:table-row; }
/* As cards, the table needs no frame of its own. */
.mesh-data-page .data-table-wrap:has(> .card-table.is-cards) { border:0; background:none; overflow:visible; }

/* Maps on data pages; a node's popup on them is in meshview.css. */
.mesh-data-page #map { width:100%; height:650px; margin:18px 0 24px; border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); }
.mesh-data-page .leaflet-container { background:var(--mesh-surface-2); z-index:1; }

/* Icon buttons on chart and table toolbars (expand, export, refresh). */
.chart-tool { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:var(--mesh-radius-sm); background:transparent; color:var(--mesh-muted); }
.chart-tool .ti { width:18px; height:18px; vertical-align:0; }
.chart-tool:hover:not(:disabled),.chart-tool:focus-visible { background:var(--mesh-soft); color:var(--mesh-primary); border-color:var(--mesh-border); }
.chart-tool:disabled { opacity:.4; cursor:default; }

/* No subject asked for (no node in the address): a note where the page would be. */
.mesh-data-page .page-missing { margin:0 0 14px; padding:30px 16px; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); color:var(--mesh-muted); text-align:center; }
.mesh-data-page .page-missing[hidden] { display:none; }

/* What a page shows, folded under its heading: its title and a chevron that
   turns down when open. */
.mesh-data-page .page-explain { margin-bottom:14px; padding:12px 16px; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); color:var(--mesh-muted); font-size:13px; }
.mesh-data-page .page-explain summary { display:flex; align-items:center; gap:6px; list-style:none; cursor:pointer; color:var(--mesh-text); font-weight:600; }
.mesh-data-page .page-explain summary::-webkit-details-marker { display:none; }
.mesh-data-page .page-explain summary svg { width:14px; height:14px; color:var(--mesh-muted); transition:transform .15s ease; }
.mesh-data-page .page-explain[open] summary svg { transform:rotate(90deg); }
.mesh-data-page .page-explain p { margin:12px 0 0; line-height:1.7; }

/* What a page reports on and the choices it gives, in a bar right over the
   report: each its label over its value or its control. */
.mesh-data-page .subject-bar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 20px; margin-bottom:14px; padding:12px 16px; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:var(--mesh-radius); }
.mesh-data-page .subject-field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.mesh-data-page .subject-node { flex:1 1 260px; }
.mesh-data-page .subject-label { margin:0; color:var(--mesh-muted); font-size:12px; }
.mesh-data-page .subject-value { display:flex; align-items:center; gap:8px; min-height:var(--mesh-control); margin:0; font-size:14px; overflow-wrap:anywhere; }
.mesh-data-page .subject-value a { color:var(--mesh-primary); font-weight:650; }
.mesh-data-page .subject-id { color:var(--mesh-muted); font-size:12.5px; }
/* Where all do not fit on one line, the node takes its own, its name, which says
   what it is by itself, without its label (kept for screen readers); the rest
   share the next one. */
@media(max-width:1000px) {
    .mesh-data-page .subject-node { flex-basis:100%; }
    .mesh-data-page .subject-node .subject-label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .mesh-data-page .subject-node .subject-value { min-height:0; }
    .mesh-data-page .subject-field:not(.subject-node) { flex:1 1 0; }
}
/* Phones: a label said short. */
.mesh-data-page .subject-label .label-short { display:none; }
@media(max-width:700px) {
    .mesh-data-page .subject-label .label-long { display:none; }
    .mesh-data-page .subject-label .label-short { display:inline; }
}

/* The actions under the title (.is-stacked, set by base.html) take the whole
   line, and a select grows into the room. */
.mesh-data-page .data-heading.is-stacked .data-actions { width:100%; margin-left:0; }
.mesh-data-page .data-heading.is-stacked .data-actions select { flex:1; min-width:0; width:auto; }

@media(max-width:700px) {
    .mesh-data-page .data-heading { align-items:flex-start; }
    /* The actions take the whole line under the title; a select grows into the room. */
    .mesh-data-page .data-actions { width:100%; margin-left:0; }
    .mesh-data-page .data-actions select { flex:1; min-width:0; width:auto; }
    /* A lone button stays beside the title. */
    .mesh-data-page .data-heading:has(.data-actions > .mesh-button:only-child) { flex-wrap:nowrap; align-items:center; }
    .mesh-data-page .data-heading .data-actions:has(> .mesh-button:only-child) { width:auto; margin-left:auto; }
    /* The select says what it filters by itself: its label stays for screen readers. */
    .mesh-data-page .data-actions label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .mesh-data-page .data-table-wrap { overflow:auto; }
    .mesh-data-page .data-table-wrap table { min-width:700px; }
    .mesh-data-page .data-table-wrap table.card-table { min-width:0; }
    .mesh-data-page #map { height:500px; }
}
</style>
