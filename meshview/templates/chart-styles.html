<style>
/* The chart cards of the node and radio pages; their script is chart-kit.js. */
.chart-container { position:relative; width:100%; background:var(--mesh-surface); border:1px solid var(--mesh-border); border-radius:9px; margin-bottom:20px; overflow:hidden; }
.chart-header { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--mesh-border); font-size:14px; font-weight:600; }
.chart-title { display:flex; align-items:center; gap:8px; min-width:0; margin:0; font-size:15px; font-weight:650; }
.chart-title .ti { color:var(--mesh-primary); font-size:18px; }
.chart-loading { position:absolute; left:0; right:0; top:66px; bottom:0; display:flex; align-items:center; justify-content:center; margin:0; color:var(--mesh-muted); pointer-events:none; }
.chart-actions { display:flex; gap:4px; flex-shrink:0; }
#chartModal { display:none; position:fixed; inset:0; background:#17263c99; z-index:9999; align-items:center; justify-content:center; padding:16px; }
#chartModal > div { background:var(--mesh-surface); border-radius:10px; width:95%; height:85%; padding:14px; }
/* A chart with nothing in its period shows a line in the middle of its card instead. */
.chart-empty { display:flex; align-items:center; justify-content:center; min-height:180px; margin:0; padding:20px; color:var(--mesh-muted); text-align:center; }
.chart-canvas[hidden],.chart-empty[hidden],.signal-table-wrap[hidden] { display:none; }
.chart-period { width:auto; }
/* Controls over a chart: pill toggles and a note beside them. */
.chart-controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px 20px 0; }
.chart-note { flex:1 1 220px; margin:0; color:var(--mesh-muted); font-size:13px; }
.pill-toggle { position:relative; z-index:0; display:inline-flex; padding:3px; border:1px solid var(--mesh-border); border-radius:999px; background:var(--mesh-soft); }
/* The thumb slides to the pressed option; JS gives it that option's place and width. */
.pill-toggle::before { content:""; position:absolute; z-index:-1; top:3px; bottom:3px; left:0; width:var(--thumb-w,0); transform:translateX(var(--thumb-x,0)); border-radius:999px; background:var(--mesh-primary); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.pill-toggle.is-ready::before { transition:transform .25s ease, width .25s ease; }
.mesh-data-page .mesh-content .pill-toggle > button { display:inline-flex; align-items:center; gap:4px; padding:5px 13px; border:0; border-radius:999px; background:transparent; color:var(--mesh-text); transition:color .25s ease; }
/* Tabler icons leave room inside their box: shift what has one a little left to look centred. */
.mesh-data-page .mesh-content .pill-toggle > button:has(> .ti) { padding-left:11px; padding-right:15px; }
.mesh-data-page .mesh-content .pill-toggle > button:hover:not(:disabled) { background:transparent; color:var(--mesh-primary); }
.mesh-data-page .mesh-content .pill-toggle > button[aria-pressed="true"],
.mesh-data-page .mesh-content .pill-toggle > button[aria-pressed="true"]:hover { color:var(--mesh-surface); }
.mesh-data-page .mesh-content .pill-toggle > button:disabled { cursor:default; }
.pill-toggle:has(> button:disabled) { opacity:.45; }
@media(prefers-reduced-motion:reduce) { .pill-toggle.is-ready::before,.mesh-data-page .mesh-content .pill-toggle > button { transition:none; } }
/* A table of nodes and the signal they were heard with, under a chart or on its own. */
.signal-table-wrap { overflow:auto; padding:0 20px 16px; }
.signal-table { width:100%; border-collapse:collapse; font-size:13px; }
.signal-table th,.signal-table td { padding:7px 10px; border-bottom:1px solid var(--mesh-border); text-align:left; white-space:nowrap; }
.signal-table th { color:var(--mesh-muted); font-weight:600; font-size:12px; }
.signal-table .is-number { text-align:right; font-variant-numeric:tabular-nums; }
.signal-table .is-group { text-align:center; }
.signal-table td.signal-summary { display:none; }
.chart-hint { margin:10px 0 0; color:var(--mesh-muted); font-size:12px; }
/* No chart, nothing to tell how to use. */
.chart-canvas[hidden] ~ .chart-hint { display:none; }
/* With a mouse or with a finger, the hint that says how to use the chart. */
@media(pointer:fine) { .chart-hint-touch { display:none; } }
@media not (pointer:fine) { .chart-hint-mouse { display:none; } }
/* On a phone, only the signal shown, and long names cut short. */
@media(max-width:700px) {
  .chart-header { padding:12px; }
  .chart-controls { gap:6px; padding:12px 12px 0; }
  .pill-toggle + .pill-toggle { margin-left:auto; }
  .signal-table-wrap { padding:0 12px 12px; }
  .signal-table thead,.signal-table td.is-number { display:none; }
  .signal-table tbody tr { display:block; padding:8px 4px; border-bottom:1px solid var(--mesh-border); }
  .signal-table td { display:block; overflow:hidden; text-overflow:ellipsis; }
  .mesh-data-page .signal-table td { height:auto; padding:0; border:0; }
  .signal-table td.signal-summary { display:block; margin-top:3px; color:var(--mesh-muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .signal-table[data-metric="rssi"] .is-snr,.signal-table[data-metric="snr"] .is-rssi { display:none; }
  .mesh-data-page .mesh-content .pill-toggle > button { padding:5px 8px; }
  .mesh-data-page .mesh-content .pill-toggle > button:has(> .ti) { padding-left:7px; padding-right:10px; }
}
</style>
