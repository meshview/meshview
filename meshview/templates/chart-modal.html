<!-- An expanded chart, with its card's title and selects; chart-kit.js fills it. -->
<div id="chartModal" class="chart-modal" role="dialog" aria-modal="true" aria-labelledby="chart-modal-title">
    <div class="chart-modal-box">
        <div class="chart-modal-head">
            <h2 id="chart-modal-title"></h2>
            <div id="chart-modal-controls" class="chart-modal-controls"></div>
            <button type="button" class="mesh-dialog-close" onclick="closeModal()" aria-label="{{ "Close" | tr }}" title="{{ "Close" | tr }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="modalChart"></div>
    </div>
</div>
