{% extends "base.html" %}

{% block css %}
<style>
/* The chat fills the window under the header, with no footer: its own bar on
   top, the messages, and a line of notes at the bottom. */
body:has(#chat-container) { height:100dvh; overflow:hidden; }
body:has(#chat-container) .mesh-content { display:flex; flex:1; min-height:0; max-width:none; padding:0; }
body:has(#chat-container) .mesh-footer { display:none; }
#chat-container { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; background:var(--mesh-page); }

/* The bar: channel and search on the left; count, state and buttons on the right. */
.chat-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 16px; background:var(--mesh-surface); border-bottom:1px solid var(--mesh-border); flex-shrink:0; }
.chat-filters { display:flex; align-items:center; gap:8px; min-width:0; }
.chat-count { font-size:12.5px; color:var(--mesh-muted); white-space:nowrap; }
.chat-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-left:auto; }
.chat-filter { width:180px; }
.chat-search { position:relative; display:flex; align-items:center; width:240px; }
.chat-search svg { position:absolute; left:11px; width:17px; height:17px; color:var(--mesh-muted); pointer-events:none; }
.chat-search input { width:100%; padding-left:36px; }
/* The state, a pill with its dot: live, paused, loading or failing. */
.chat-status { display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 10px; border-radius:var(--mesh-radius-pill); background:var(--mesh-soft); color:var(--mesh-primary); font-size:12.5px; font-weight:600; white-space:nowrap; }
.chat-status::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--mesh-live); }
.chat-status:is([data-state="paused"],[data-state="loading"]) { background:var(--mesh-surface-2); color:var(--mesh-muted); }
.chat-status:is([data-state="paused"],[data-state="loading"])::before { background:var(--mesh-muted); }
.chat-status[data-state="error"] { background:color-mix(in srgb, #dc3545 12%, var(--mesh-surface)); color:var(--mesh-danger); }
.chat-status[data-state="error"]::before { background:#dc3545; }
.chat-latest svg { color:var(--mesh-primary); }
.chat-latest:disabled { opacity:.5; cursor:default; }
.chat-unread { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:var(--mesh-radius-pill); background:var(--mesh-primary); color:var(--mesh-on-primary); font-size:11px; font-weight:700; }

/* The messages, oldest to newest. */
.chat-messages { flex:1; min-height:0; overflow-y:auto; overflow-anchor:none; padding:8px 0 12px; background:var(--mesh-surface); font-size:14px; line-height:1.5; scrollbar-gutter:stable; }
.chat-date-sep { display:flex; align-items:center; gap:14px; margin:14px 16px 6px; color:var(--mesh-muted); font-size:11.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; }
.chat-date-sep::before,.chat-date-sep::after { content:""; flex:1; height:1px; background:var(--mesh-border-soft); }
.chat-line { display:grid; grid-template-columns:52px 170px minmax(0,1fr) auto; gap:12px; align-items:baseline; padding:7px 16px; border-bottom:1px solid var(--mesh-border-soft); --chat-row-bg:var(--mesh-surface); background:var(--chat-row-bg); }
.chat-line:hover,.chat-line:focus-within { background:var(--mesh-surface-2); }
.chat-time { color:var(--mesh-muted); font-size:12.5px; white-space:nowrap; }
.chat-time:hover { color:var(--mesh-primary); }
.chat-nick { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; font-weight:600; text-align:right; }
[data-theme="dark"] .chat-nick { filter:brightness(1.45) saturate(.8); }
.chat-message { min-width:0; overflow-wrap:anywhere; white-space:pre-wrap; }
.replying-to { display:block; margin:4px 0 2px; padding:1px 10px; border-left:2px solid var(--mesh-border-strong); color:var(--mesh-muted); font-size:12.5px; white-space:normal; }
.chat-meta { display:flex; align-items:center; gap:10px; font-size:12px; }
/* The channel's tag, with the dot of its colour on the maps. */
.chat-channel { display:inline-flex; align-items:center; gap:6px; max-width:150px; padding:1px 8px 1px 7px; border:1px solid var(--mesh-border); border-radius:var(--mesh-radius-xs); color:var(--mesh-muted); white-space:nowrap; }
.chat-channel::before { content:""; flex-shrink:0; width:8px; height:8px; border-radius:2px; background:var(--channel-color,var(--mesh-muted)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
.chat-channel-name { overflow:hidden; text-overflow:ellipsis; }
/* Opened by a tap: as wide as its name, the sender giving way. */
.chat-channel.is-open { max-width:none; }
.chat-older { display:flex; justify-content:center; padding:4px 16px 10px; color:var(--mesh-muted); font-size:12.5px; }
.chat-empty { padding:48px 20px; text-align:center; color:var(--mesh-muted); font-size:13.5px; }
.chat-bottom { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px; border-top:1px solid var(--mesh-border); background:var(--mesh-surface); color:var(--mesh-muted); font-size:12px; flex-shrink:0; }
.chat-bottom p { margin:0; }
.chat-line.flash { animation:chat-flash 2s ease-out; }
@keyframes chat-flash { from { background:var(--mesh-pulse-peak); } to { background:var(--chat-row-bg); } }
@media(prefers-reduced-motion:reduce) { .chat-line.flash { animation:none; } }

/* Narrow: the bar on two lines, the controls sharing the second; each message
   with time, sender and channel above its text. */
@media(max-width:900px) {
    .chat-filters,.chat-actions { width:100%; margin-left:0; }
    .chat-filter { flex:1 1 140px; width:auto; min-width:0; }
    .chat-search { flex:2 1 180px; width:auto; min-width:0; }
    .chat-count { margin-right:auto; }
    /* Typing, the search gives its magnifier's room to the text. */
    .chat-search:focus-within svg { display:none; }
    .chat-search:focus-within input { padding-left:10px; }
}
@media(max-width:700px) {
    .chat-toolbar { padding:10px 14px; }
    .chat-line { grid-template-columns:44px minmax(0,1fr) auto; gap:2px 8px; padding:8px 14px; }
    .chat-time { grid-column:1; grid-row:1; }
    .chat-nick { grid-column:2; grid-row:1; text-align:left; }
    .chat-meta { grid-column:3; grid-row:1; gap:8px; }
    .chat-channel { max-width:90px; }
    .chat-message { grid-column:2 / 4; grid-row:2; }
    .chat-date-sep { margin:14px 14px 6px; }
    .chat-bottom { padding:8px 14px; }
}
@media(max-width:480px) {
    /* "Jump to latest" by its arrow, and its count of new messages, alone; the
       words stay for screen readers. */
    .chat-latest { font-size:0; gap:4px; padding:0 10px; }
    .chat-unread { font-size:11px; }
}
</style>
{% endblock %}

{% block body %}
<section id="chat-container" aria-label="{{ "Mesh chat" | tr }}">
    <div class="chat-toolbar">
        <h1 class="visually-hidden">{{ "Chat" | tr }}</h1>
        <div class="chat-filters">
            <label for="channel-filter" class="visually-hidden" data-chat-translate="channel">Channel</label>
            <select id="channel-filter" class="mesh-select chat-filter"><option value="" data-chat-translate="all_channels">All channels</option></select>
            <label class="chat-search">
                <span class="visually-hidden">{{ "Search messages or nodes" | tr }}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M21 21l-6 -6"/></svg>
                <input id="chat-search" class="mesh-input" type="search" placeholder="{{ "Search messages or nodes…" | tr }}" autocomplete="off">
            </label>
        </div>
        <div class="chat-actions">
            <span id="chat-count" class="chat-count">{{ "0 messages" | tr }}</span>
            <span id="chat-status" class="chat-status" data-state="loading" role="status">{{ "Connecting…" | tr }}</span>
            <button id="chat-pause" class="mesh-button" type="button" aria-pressed="false">{{ "Pause" | tr }}</button>
            <button id="chat-latest" class="mesh-button chat-latest" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M12 14v-10M12 14l4 -4M12 14l-4 -4"/></svg>{{ "Jump to latest" | tr }} <span id="chat-unread" class="chat-unread" hidden></span></button>
        </div>
    </div>
    <div id="chat-log" class="chat-messages" role="region" aria-label="{{ "Messages, oldest to newest" | tr }}" tabindex="0"><p class="chat-empty is-loading">{{ "Loading messages…" | tr }}</p></div>
    <div class="chat-bottom"><p>{{ "Received text messages · updates every 5 seconds" | tr }}</p><span id="chat-updated" role="status"></span></div>
</section>
<script src="/static/channel-colors.js"></script>
<script src="/static/chat-dashboard.js"></script>
{% endblock %}
