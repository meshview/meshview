<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshview Kiosk</title>
    <script>
        // Straight on to the map. Nothing is translated here: the link below is
        // only seen without JavaScript, when no translation could run either.
        const target = new URL('/map', location.origin);
        target.search = location.search;
        target.searchParams.set('kiosk', '1');
        target.hash = location.hash;
        location.replace(target.href);
    </script>
</head>
<body>
    <a href="/map?kiosk=1" data-i18n="Open the fullscreen live map">Open the fullscreen live map</a>
</body>
</html>
