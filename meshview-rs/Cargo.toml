[package]
name = "meshview-rs"
description = "Real-time monitoring and diagnostics for Meshtastic mesh networks"
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["meshtastic", "mesh", "lora", "mqtt", "monitoring"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
aes = "0.9"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ctr = "0.10"
meshview-proto = { path = "../meshview-proto" }
prost.workspace = true
# TLS through rustls, but with no crypto provider chosen here: its default is
# aws-lc, which wants cmake and a C toolchain to cross compile. `ring` is chosen
# below instead, as tocata does.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite only for now. PostgreSQL is meant to arrive as a second backend behind
# the same interface, which is why everything SQLite specific lives in db::sqlite.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
# The roots are compiled in rather than read from the system, which is what lets
# the image ship without ca-certificates.
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
# Only to call the router the way axum does, with `ServiceExt::oneshot`. axum
# already pulls tower in with this feature, so it adds no crate.
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
