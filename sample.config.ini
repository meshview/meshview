# meshview-rs reads the Python meshview's config.ini as it is: an existing one
# can be used unchanged. This sample lists only what meshview-rs already acts on;
# the other sections of the Python sample ([site], [mqtt], [cleanup], [snapshot],
# [map_channel_colors]...) are read and will be used as each part is ported.
#
# Any value can also come from the environment as MESHVIEW_<SECTION>__<KEY>, for
# example MESHVIEW_DATABASE__CONNECTION_STRING or MESHVIEW_SERVER__PORT, which
# wins over the file.

[server]
# The address to listen on. * means every interface.
bind = *
# The port, the same default as the Python version.
port = 8081
# Not supported yet: terminate TLS in front of meshview-rs.
tls_cert =

[database]
# SQLAlchemy's form, as in the Python version: three slashes and a relative path,
# or four for an absolute one. The +aiosqlite driver suffix is accepted and
# ignored. PostgreSQL is not supported yet.
#   sqlite+aiosqlite:///packets.db
#   sqlite:////var/lib/meshview/packets.db
connection_string = sqlite+aiosqlite:///packets.db
